services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - streaming

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    networks:
      - streaming
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'

  spark-master:
    image: apache/spark:3.5.1
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "7077:7077"
      - "8080:8080"
    networks:
      - streaming

  spark-worker1:
    image: apache/spark:3.5.1
    depends_on:
      - spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "1"
      - --memory
      - 1g
      - --webui-port
      - "8081"
    ports:
      - "8081:8081"
    networks:
      - streaming

  spark-worker2:
    image: apache/spark:3.5.1
    depends_on:
      - spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "1"
      - --memory
      - 1g
      - --webui-port
      - "8081"
    ports:
      - "8082:8081"
    networks:
      - streaming
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - streaming

  gnn-app:
    build: .
    depends_on:
      - kafka
      - spark-master
    volumes:
      - ./:/app
    working_dir: /app
    tty: true
    stdin_open: true
    command: bash -lc "echo 'Spark app container is ready. Use docker compose exec gnn-app bash and run spark-submit against spark://spark-master:7077.' && sleep infinity"
    networks:
      - streaming

  spark-runner:
    image: elliptic-spark-runner:light
    build:
      context: .
      dockerfile: Dockerfile.spark-run
    depends_on:
      - kafka
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=python3
    mem_limit: 4g
    networks:
      - streaming
    restart: "no"

networks:
  streaming:
    driver: bridge

volumes:
  minio-data:
